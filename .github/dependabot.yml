# Dependabot — atualizações automáticas de dependências.
# Abre PRs semanais de atualização; combinado com o Dependabot security
# updates (ligado nas configurações do repo), cobre correções de segurança.
#
# Todas as entradas apontam para `develop`: pelo fluxo do README, `main` só é
# atualizada por PR de release. Sem target-branch, o Dependabot abre contra a
# branch padrão (main) e as atualizações entrariam sem passar pela integração.
version: 2
updates:
  # Frontend (Next.js)
  - package-ecosystem: npm
    directory: /frontend
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      frontend-minor-patch:
        update-types:
          - minor
          - patch

  # Testes E2E (Playwright)
  - package-ecosystem: npm
    directory: /e2e
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Worker de IA (Python)
  - package-ecosystem: pip
    directory: /worker-ai
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly

  # Imagens base dos Dockerfiles. As bases são fixadas por digest para que o
  # build seja reproduzível; sem estas entradas, um digest fixo deixaria de
  # receber correções de segurança da base.
  #
  # Major fica de fora: a runtime das imagens tem de casar com a declarada na
  # CI (Java 21, Node 22, Python 3.12). Subir para Java 24 ou Node 26 por PR
  # automático quebraria essa paridade sem ninguém decidir — essa troca é feita
  # junto com a da CI, à mão.
  - package-ecosystem: docker
    directories:
      - /
      - /frontend
      - /worker-ai
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
