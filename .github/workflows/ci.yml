# Integração contínua: Maven/Quarkus, Next.js e worker Python.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Maven / Quarkus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Testes e package (Quarkus)
        run: chmod +x mvnw && ./mvnw -B clean verify

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes (Vitest)
        run: npm test

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_API_URL: https://placeholder.local
        run: npm run build

  worker-ai:
    name: Worker (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker-ai
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: archlens
          POSTGRES_USER: archlens
          POSTGRES_PASSWORD: archlens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U archlens"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker-ai/requirements.txt

      - name: Dependências
        run: pip install -r requirements-dev.txt

      - name: Verificação de sintaxe / bytecode
        run: python -m compileall -q app

      - name: Smoke import FastAPI
        run: PYTHONPATH=. python -c "from app.main import app"

      - name: Testes (pytest)
        env:
          DATABASE_URL: postgresql://archlens:archlens@localhost:5432/archlens
        run: python -m pytest -q

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Instalar dependências
        run: |
          npm --prefix ../frontend ci
          npm ci
          npx playwright install chromium --with-deps

      - name: Smoke E2E
        env:
          CI: "true"
        run: npm test
