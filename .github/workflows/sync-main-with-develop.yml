name: Sync main with develop

# Git flow: após push em develop, abre PR develop → main e faz merge (main protegida).

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: sync-main-with-develop
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Abrir ou reutilizar PR develop → main e fazer merge
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch origin main develop

          MAIN=$(git rev-parse origin/main)
          DEV=$(git rev-parse origin/develop)

          if [[ "$MAIN" == "$DEV" ]]; then
            echo "main já aponta para o mesmo commit que develop."
            exit 0
          fi

          OPEN=$(gh pr list --repo "$REPOSITORY" --base main --head develop --state open --json number -q '.[0].number // empty')
          if [[ -z "${OPEN:-}" ]] || [[ "$OPEN" == "null" ]]; then
            gh pr create \
              --repo "$REPOSITORY" \
              --base main \
              --head develop \
              --title 'chore(sync): alinhar main com develop [automático]' \
              --body 'Criado automaticamente pelo workflow Sync main with develop (git flow).'
          fi

          PR=$(gh pr list --repo "$REPOSITORY" --base main --head develop --state open --json number -q '.[0].number')
          echo "Fazendo merge do PR #$PR"
          gh pr merge "$PR" --repo "$REPOSITORY" --merge --admin || {
            echo "::error ::gh pr merge falhou (permissões, reviews ou checks pendentes)."
            exit 1
          }
