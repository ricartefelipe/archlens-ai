name: Sync main with develop

# Git flow: verificação SOMENTE LEITURA. Após push em develop, apenas informa
# se develop está à frente de main e fornece o link para abrir um PR manual.
# Não cria PR, não habilita auto-merge, não faz force-push/reset e não usa PAT.
# A promoção develop -> main é decisão do proprietário, via PR revisado.

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: sync-main-with-develop
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verificar divergência develop -> main (somente leitura)
        env:
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail

          git fetch origin main develop

          AHEAD=$(git rev-list --count origin/main..origin/develop)
          if [[ "$AHEAD" -eq 0 ]]; then
            echo "main já contém todos os commits de develop; nada a promover."
            exit 0
          fi

          echo "::notice ::develop está $AHEAD commit(s) à frente de main."
          echo "Para promover, abra um PR manual revisado (nenhum PR é criado ou mergeado por este workflow):"
          echo "  ${SERVER_URL}/${REPOSITORY}/compare/main...develop?expand=1"
          echo ""
          echo "Commits pendentes:"
          git log --oneline origin/main..origin/develop
