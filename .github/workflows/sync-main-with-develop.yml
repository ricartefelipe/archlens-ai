name: Sync main with develop

# Git flow: após push em develop, abre PR develop → main e faz merge (main protegida).

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: sync-main-with-develop
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Abrir ou reutilizar PR develop → main e habilitar auto-merge
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::warning ::Secret SYNC_TOKEN ausente; sincronização automática desativada. Configure um PAT com contents:write e pull-requests:write."
            exit 0
          fi

          git fetch origin main develop

          AHEAD=$(git rev-list --count origin/main..origin/develop)
          if [[ "$AHEAD" -eq 0 ]]; then
            echo "main já contém todos os commits de develop; nada a sincronizar."
            exit 0
          fi

          OPEN=$(gh pr list --repo "$REPOSITORY" --base main --head develop --state open --json number -q '.[0].number // empty')
          if [[ -z "${OPEN:-}" ]] || [[ "$OPEN" == "null" ]]; then
            gh pr create \
              --repo "$REPOSITORY" \
              --base main \
              --head develop \
              --title 'chore(sync): alinhar main com develop [automático]' \
              --body 'Criado automaticamente pelo workflow Sync main with develop (git flow).'
          fi

          PR=$(gh pr list --repo "$REPOSITORY" --base main --head develop --state open --json number -q '.[0].number')
          echo "Habilitando auto-merge do PR #$PR (mergeia quando os checks obrigatórios passarem)."
          gh pr merge "$PR" --repo "$REPOSITORY" --merge --auto
