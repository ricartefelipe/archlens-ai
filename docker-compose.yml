services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: archlens-postgres
    environment:
      POSTGRES_DB: archlens
      POSTGRES_USER: archlens
      POSTGRES_PASSWORD: archlens
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archlens"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: archlens-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: archlens-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/archlens
      KC_DB_USERNAME: archlens
      KC_DB_PASSWORD: archlens
      KC_DB_SCHEMA: keycloak
    ports:
      - "8180:8080"
    volumes:
      - ./infra/keycloak/archlens-realm.json:/opt/keycloak/data/import/archlens-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: archlens-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: archlens
      RABBITMQ_DEFAULT_PASS: archlens
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker-ai:
    build:
      context: ./worker-ai
      dockerfile: Dockerfile
    container_name: archlens-worker-ai
    environment:
      DATABASE_URL: postgresql://archlens:archlens@postgres:5432/archlens
      EMBEDDING_PROVIDER: local
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1536}
      EMBEDDING_DIMENSION_VERIFY: ${EMBEDDING_DIMENSION_VERIFY:-true}
      STORAGE_BASE_PATH: /data/projects
      LOG_LEVEL: INFO
    volumes:
      - projectdata:/data/projects
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: archlens-backend
    environment:
      QUARKUS_PROFILE: prod
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/archlens
      QUARKUS_DATASOURCE_USERNAME: archlens
      QUARKUS_DATASOURCE_PASSWORD: archlens
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: archlens
      RABBITMQ_PASSWORD: archlens
      WORKER_AI_BASE_URL: http://worker-ai:8000
      ARCHLENS_STORAGE_BASE_PATH: /data/projects
      ARCHLENS_LLM_PROVIDER: local
      ARCHLENS_ANALYSIS_LLM_FALLBACK: "false"
      ARCHLENS_RLS_ENABLED: "true"
      OIDC_AUTH_SERVER_URL: http://keycloak:8080/realms/archlens
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    volumes:
      - projectdata:/data/projects
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      worker-ai:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
        NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:8180
        NEXT_PUBLIC_OIDC_ENABLED: "true"
    container_name: archlens-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
  projectdata:
