quarkus:
  application:
    name: archlens-ai

  datasource:
    db-kind: postgresql
    username: archlens
    password: archlens
    jdbc:
      url: jdbc:postgresql://localhost:5432/archlens
      max-size: 16

  hibernate-orm:
    schema-management:
      strategy: validate
    physical-naming-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

  liquibase:
    migrate-at-start: true
    change-log: db/changelog/db.changelog-master.yaml

  http:
    port: 8080
    limits:
      max-body-size: 200M
      max-form-attribute-size: 200M
    cors:
      origins: "*"
      methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
      headers: "*"
      exposed-headers: X-Correlation-Id
    auth:
      proactive: false
      permission:
        auth-public:
          paths: /public/*
          policy: permit
        health:
          paths: /q/*
          policy: permit
        api:
          paths: /v1/*
          policy: authenticated
          auth-mechanism: bearer,api-key

  log:
    console:
      json:
        enabled: true
    level: INFO
    category:
      "dev.archlens":
        level: DEBUG
    min-level: TRACE

  smallrye-openapi:
    info-title: ArchLens AI API
    info-version: 0.1.0
    info-description: Multi-tenant Architectural Intelligence Platform
    security-scheme:
      bearerAuth:
        type: HTTP
        scheme: bearer
        bearer-format: JWT
      apiKeyAuth:
        type: APIKEY
        in: header
        api-key-name: X-Api-Key

  otel:
    enabled: false

  oidc:
    auth-server-url: http://localhost:8180/realms/archlens
    client-id: archlens-api
    roles:
      role-claim-path: realm_roles
    tls:
      verification: none
    token:
      issuer: any

  rest-client:
    worker-ai:
      url: http://localhost:8081


  micrometer:
    export:
      prometheus:
        enabled: true

"%dev":
  quarkus:
    oidc:
      enabled: false
    http:
      auth:
        permission:
          api:
            policy: permit
    log:
      console:
        json:
          enabled: false
        format: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%X{correlationId}] [%c{3.}] (%t) %s%e%n"
      level: INFO
      category:
        "dev.archlens":
          level: DEBUG
    hibernate-orm:
      log:
        sql: true

"%test":
  quarkus:
    oidc:
      enabled: false
    http:
      auth:
        permission:
          api:
            policy: permit
    log:
      console:
        json:
          enabled: false
    datasource:
      db-kind: postgresql
      username: archlens
      password: archlens
      jdbc:
        url: jdbc:postgresql://localhost:5432/archlens
  archlens:
    commercial:
      enforce-quotas: false

rabbitmq-host: ${RABBITMQ_HOST:localhost}
rabbitmq-port: ${RABBITMQ_PORT:5672}
rabbitmq-username: ${RABBITMQ_USERNAME:archlens}
rabbitmq-password: ${RABBITMQ_PASSWORD:archlens}

archlens:
  llm:
    provider: ${ARCHLENS_LLM_PROVIDER:local}
    openai:
      api-key: ${ARCHLENS_LLM_OPENAI_API_KEY:}
      base-url: ${ARCHLENS_LLM_OPENAI_BASE_URL:https://api.openai.com}
      model: ${ARCHLENS_LLM_OPENAI_MODEL:gpt-4o-mini}
    ollama:
      base-url: ${ARCHLENS_LLM_OLLAMA_BASE_URL:http://localhost:11434}
      model: ${ARCHLENS_LLM_OLLAMA_MODEL:llama3.2}
  embedding:
    dimension: ${ARCHLENS_EMBEDDING_DIMENSION:1536}
  storage:
    base-path: ${ARCHLENS_STORAGE_BASE_PATH:/tmp/archlens/projects}
  ingest:
    async: ${ARCHLENS_INGEST_ASYNC:true}
  auth:
    keycloak-token-url: ${KEYCLOAK_TOKEN_URL:http://localhost:8180/realms/archlens/protocol/openid-connect/token}
    client-id: ${KEYCLOAK_LOGIN_CLIENT_ID:archlens-bff}
    client-secret: ${KEYCLOAK_LOGIN_CLIENT_SECRET:archlens-bff-dev-secret}
  analysis:
    llm-fallback-enabled: ${ARCHLENS_ANALYSIS_LLM_FALLBACK:false}
  rls:
    enabled: ${ARCHLENS_RLS_ENABLED:false}
  report:
    brand-name: ${ARCHLENS_REPORT_BRAND_NAME:ArchLens}
    logo-url: ${ARCHLENS_REPORT_LOGO_URL:}
  commercial:
    enforce-quotas: ${ARCHLENS_ENFORCE_QUOTAS:true}

mp:
  messaging:
    outgoing:
      analysis-requests-out:
        connector: smallrye-rabbitmq
        exchange:
          name: analysis-requests
          type: fanout
          durable: true
          auto-delete: false
          declare: true
        content-type-override: application/json
    incoming:
      analysis-requests-in:
        connector: smallrye-rabbitmq
        exchange:
          name: analysis-requests
          type: fanout
          durable: true
          auto-delete: false
          declare: true
        queue:
          name: analysis-requests-queue
          durable: true
          declare: true
        content-type-override: application/json

"%prod":
  archlens:
    analysis:
      llm-fallback-enabled: false
    rls:
      enabled: true
  quarkus:
    datasource:
      username: ${QUARKUS_DATASOURCE_USERNAME:archlens}
      password: ${QUARKUS_DATASOURCE_PASSWORD:archlens}
      jdbc:
        url: ${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/archlens}
    oidc:
      auth-server-url: ${OIDC_AUTH_SERVER_URL:http://localhost:8180/realms/archlens}
    http:
      cors:
        origins: ${CORS_ORIGINS:*}
    rest-client:
      worker-ai:
        url: ${WORKER_AI_BASE_URL:http://localhost:8081}
