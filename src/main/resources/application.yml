quarkus:
  application:
    name: archlens-ai

  datasource:
    db-kind: postgresql
    username: archlens
    password: archlens
    jdbc:
      url: jdbc:postgresql://localhost:5432/archlens
      max-size: 16

  hibernate-orm:
    schema-management:
      strategy: validate
    physical-naming-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

  liquibase:
    migrate-at-start: true
    change-log: db/changelog/db.changelog-master.yaml

  http:
    port: 8080
    cors:
      origins: "*"
      methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
      headers: "*"
      exposed-headers: X-Correlation-Id
    auth:
      permission:
        health:
          paths: /q/*
          policy: permit
        api:
          paths: /v1/*
          policy: authenticated
          auth-mechanism: bearer

  log:
    console:
      json:
        enabled: true
    level: INFO
    category:
      "dev.archlens":
        level: DEBUG
    min-level: TRACE

  smallrye-openapi:
    info-title: ArchLens AI API
    info-version: 0.1.0
    info-description: Multi-tenant Architectural Intelligence Platform

  otel:
    enabled: false

  oidc:
    auth-server-url: http://localhost:8180/realms/archlens
    client-id: archlens-api
    tls:
      verification: none
    token:
      issuer: any

  rest-client:
    worker-ai:
      url: http://localhost:8081


  micrometer:
    export:
      prometheus:
        enabled: true

"%dev":
  quarkus:
    oidc:
      enabled: false
    http:
      auth:
        permission:
          api:
            policy: permit
    log:
      console:
        json:
          enabled: false
        format: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%X{correlationId}] [%c{3.}] (%t) %s%e%n"
      level: INFO
      category:
        "dev.archlens":
          level: DEBUG
    hibernate-orm:
      log:
        sql: true

"%test":
  quarkus:
    oidc:
      enabled: false
    http:
      auth:
        permission:
          api:
            policy: permit
    log:
      console:
        json:
          enabled: false
    datasource:
      db-kind: postgresql
      username: archlens
      password: archlens
      jdbc:
        url: jdbc:postgresql://localhost:5432/archlens

rabbitmq-host: localhost
rabbitmq-port: 5672
rabbitmq-username: archlens
rabbitmq-password: archlens

mp:
  messaging:
    outgoing:
      analysis-requests-out:
        connector: smallrye-rabbitmq
        exchange:
          name: analysis-requests
          type: fanout
          durable: true
          auto-delete: false
          declare: true
        content-type-override: application/json
    incoming:
      analysis-requests-in:
        connector: smallrye-rabbitmq
        exchange:
          name: analysis-requests
          type: fanout
          durable: true
          auto-delete: false
          declare: true
        queue:
          name: analysis-requests-queue
          durable: true
          declare: true
        content-type-override: application/json
