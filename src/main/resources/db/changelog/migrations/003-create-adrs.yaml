databaseChangeLog:
  - changeSet:
      id: "003-01-create-adrs"
      author: archlens
      changes:
        - createTable:
            tableName: adrs
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: analysis_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: tenant_id
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: varchar(512)
                  constraints:
                    nullable: false
              - column:
                  name: context
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: decision
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: consequences
                  type: text
              - column:
                  name: status
                  type: varchar(32)
                  defaultValue: PROPOSED
                  constraints:
                    nullable: false
              - column:
                  name: related_findings
                  type: jsonb
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: adrs
            baseColumnNames: analysis_id
            referencedTableName: analyses
            referencedColumnNames: id
            constraintName: fk_adrs_analysis_id
            onDelete: CASCADE
        - createIndex:
            indexName: idx_adrs_analysis_id
            tableName: adrs
            columns:
              - column:
                  name: analysis_id
