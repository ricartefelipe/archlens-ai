databaseChangeLog:
  - changeSet:
      id: "006-01-create-tenant-accounts"
      author: archlens
      changes:
        - createTable:
            tableName: tenant_accounts
            columns:
              - column:
                  name: tenant_id
                  type: varchar(64)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: plan
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(16)
                  defaultValue: ACTIVE
                  constraints:
                    nullable: false
              - column:
                  name: analyses_used_period
                  type: int
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: upload_bytes_period
                  type: bigint
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: usage_period_start
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: notes
                  type: text
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
